<script>

  function closeButtonImageChange() {
    if (event.target == (document.getElementsByClassName("closebutton"))){
        document.getElementsByClassName("closebutton").src = "images/blog/close_click.png";
        console.log("button was clicked")
  
    setTimeout(function(){
        document.getElementsByClassName("closebutton").src = "images/blog/close.png";
        console.log("button was reset")
  
      }, 75);
    }
  }

  function minButtonImageChange() {
    if (event.target == (document.getElementsByClassName("minbutton"))){
        document.getElementsByClassName("minbutton").src = "images/blog/minimize_click.png";
        console.log("button 2 was clicked")
  
    setTimeout(function(){
        document.getElementsByClassName("minbutton").src = "images/blog/minimize.png";
        console.log("button 2 was reset")
        
      }, 75);
    }
  }
  
  function hideWindow(event) {
    const btn = event.target; //checking what was clicked
    const post = btn.parentNode; //storing it and the parents
  
    setTimeout(function(){
      if (post.style.display === "none"){ //if hidden, unhide
      post.style.display = "block"; 
      } else {
      post.style.display = "none"; //hide if not hidden
      }
    }, 125);
  }

  function showMenu(id) {
    const el2 = document.getElementById(id); //getting an element by the id  
   
    if (el2.style.display === "block"){
      el2.style.display = "none"; 
    } else {
      el2.style.display = "block";
    }
  }  
  
  function createWindow(id) {
    const el = document.getElementById(id); //getting an element by the id
    el.style.display = "block"; //unhiding it
    console.log("window created");
  }

  document.querySelectorAll('.blogwindow').forEach(el => {
    el.addEventListener('click', () => {
      inactive();
      el.style.backgroundImage = "linear-gradient(to right, #000080, #1084D0)";
    })
  }) 

  function inactive() {
    document.querySelectorAll('.blogwindow').forEach(el =>{
      el.style.backgroundImage = "linear-gradient(to right, #808080, #BEBEBE)"
    })
  }
</script>

dragElement(document.getElementById("id1"));
dragElement(document.getElementById("id2"));

function dragElement(elmnt) {
  var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  if (document.getElementById(elmnt.id + "header")) {
    // if present, the header is where you move the DIV from:
    document.getElementById(elmnt.id + "header").onmousedown = dragMouseDown;
  } else {
    // otherwise, move the DIV from anywhere inside the DIV:
    elmnt.onmousedown = dragMouseDown;
  }

function dragMouseDown(e) {
  e = e || window.event;
  e.preventDefault();
  // get the mouse cursor position at startup:
  pos3 = e.clientX;
  pos4 = e.clientY;
  document.onmouseup = closeDragElement;
  // call a function whenever the cursor moves:
  document.onmousemove = elementDrag;
  }

function elementDrag(e) {
  e = e || window.event;
  // calculate the new cursor position:
  pos1 = pos3 - e.clientX;
  pos2 = pos4 - e.clientY;
  pos3 = e.clientX;
  pos4 = e.clientY;
  // set the element's new position:
  elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
  elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
}

function closeDragElement() {
  // stop moving when mouse button is released:
  document.onmouseup = null;
  document.onmousemove = null;
  }
}        
</script>
