<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The web site of gremghost</title>
        <link href="stylesheet.css" rel="stylesheet" type="text/css" media="all">
    </head>
    <body>
    
  <!--taskbar and its children (start button, program buttons, etc)-->
  <div class="parent">
    <img id="startbutton" src="images/blog/taskbar/startbutton.png" onclick="changeImage('startbutton', 'images/blog/taskbar/startbutton'), showMenu('id2')">
    <div class="child">
      <img id="id2" src="images/blog/taskbar/startmenu.jpg">
    </div>

  </div>

  <div>
    <img id="taskbarF" src="images/blog/taskbar/taskbar_front.png">
    <img id="taskbarM" src="images/blog/taskbar/taskbar_middle.png">
    <img id="taskbarB" src="images/blog/taskbar/taskbar_back.png">
  </div>
  
  <!--desktop icons-->
  <div class="desktop with-clicking">
    <div data-item='one' data-status='default' class="item">
      <img class="icon" src="images/blog/desktop icons/mycomputer.png">
    </div>
    <div data-item='two' data-status='default' class="item">
      <img class="icon" src="images/blog/desktop icons/mycomputer.png">
    </div>  
  </div>

  <script>
    function changeImage(id, src) {
      let button = document.getElementById(id);
      console.log("button.src = " + button.src);
      console.log("src = " + src + '.png');    
      if(button.src.includes('_click')){
        button.src = src + '.png';
        console.log("no click");
      } else {
        button.src = src + '_click.png';
        console.log("yes click")
    }
  }
  
  function showMenu(id) {
    const el2 = document.getElementById(id); //getting an element by the id  
   
    if (el2.style.display === "block"){
      el2.style.display = "none"; 
    } else {
      el2.style.display = "block";
    }
  }  

  const context = document.querySelector(".with-clicking");

  let selectedItem = null;

  function handleSelectItem(clickedItem) {
    if (selectedItem && selectedItem !== clickedItem){
      selectedItem.dataset.status = "default";
      console.log("default");
    }
    clickedItem.dataset.status = "selected";
    console.log("selected");
    clickedItem.focus();
    selectedItem = clickedItem;
  }

  function handleLeaveItem(){
    const allItems = context.querySelectorAll("[data-item]");
    allItems.forEach( (item)=>{
      item.dataset.status = "default";
      console.log("default");      
    });

    if(selectedItem){
      selectedItem.dataset.status = "idle";
      console.log("idle");      
    }
  }

  context.addEventListener("dblclick", function(event){
    if (event.target.matches("[data-item]")){
      alert(`double clicked ${event.target.dataset.item}`);
    }
  })
  </script>
    </body>
</html>
